name: okx-damp-validator
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: okx-damp-validator
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: hour guard
        id: guard
        run: |
          H=$(date -u +%H)
          if [ "$H" -ge 7 ] && [ "$H" -le 13 ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "skip: hour=$H UTC"
          fi

      - name: restore sqlite
        if: steps.guard.outputs.go == '1'
        uses: actions/cache/restore@v4
        with:
          path: verdicts.sqlite
          key: verdicts-sqlite-v2-${{ github.run_id }}
          restore-keys: verdicts-sqlite-v2-

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == '1'
        with: { python-version: "3.12" }

      - name: deps
        if: steps.guard.outputs.go == '1'
        run: pip install requests

      - name: pipeline
        if: steps.guard.outputs.go == '1'
        env:
          OKX_DEMO_KEY:    ${{ secrets.OKX_DEMO_KEY }}
          OKX_DEMO_SECRET: ${{ secrets.OKX_DEMO_SECRET }}
          OKX_DEMO_PASS:   ${{ secrets.OKX_DEMO_PASS }}
        run: python src/pipeline.py

      - name: present
        if: steps.guard.outputs.go == '1'
        env:
          OKX_DEMO_KEY:    ${{ secrets.OKX_DEMO_KEY }}
          OKX_DEMO_SECRET: ${{ secrets.OKX_DEMO_SECRET }}
          OKX_DEMO_PASS:   ${{ secrets.OKX_DEMO_PASS }}
        run: python src/present.py

      - name: save sqlite
        if: steps.guard.outputs.go == '1'
        uses: actions/cache/save@v4
        with:
          path: verdicts.sqlite
          key: verdicts-sqlite-v2-${{ github.run_id }}

      - name: upload db artifact
        if: steps.guard.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-db
          path: verdicts.sqlite
          retention-days: 30
          overwrite: true

      - name: upload pages artifact
        if: steps.guard.outputs.go == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deploy pages
        if: steps.guard.outputs.go == '1'
        uses: actions/deploy-pages@v4
